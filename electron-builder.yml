appId: dev.woo.studio
productName: Woo Studio
artifactName: Woo-Studio-${version}-${os}-${arch}.${ext}

directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/node-pty/**/*
  # Bundled SDK binaries (see authService.ts's CLI-free auth fallback and
  # scripts/package-desktop.mjs) — spawn() can't exec a binary from inside
  # an asar archive.
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**/*
  - node_modules/@openai/codex-*/**/*

npmRebuild: true
nativeRebuilder: sequential

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

linux:
  icon: build/icon.png
  syncDesktopName: true
  target:
    - AppImage
  category: Development

mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools

win:
  icon: build/icon.png
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
